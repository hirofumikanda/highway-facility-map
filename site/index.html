<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>高速道路ネットワークマップ</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.2.0/dist/maplibre-gl.css"
  />
  <!--
    pmtilesのESMビルド（dist/esm/index.js）は依存パッケージ"fflate"への
    裸のimport指定を含み、バンドラなしのブラウザでは解決できないため、
    依存関係を内包したグローバルバンドル（dist/pmtiles.js）を通常の
    scriptタグで読み込む（main.jsからは window.pmtiles として参照する）。
  -->
  <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.4.1/dist/pmtiles.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
